name: Build Image

# Calls the shared Docker build workflow in jcwearn/workflows, replacing a local
# copy of the same four steps that withjoy-exporter and ansible-runner also
# carried, and that release.yaml's build job carried a fifth time.
#
# Builds without pushing: with no `image` input the shared workflow skips the
# registry login entirely, so this needs no credentials and no packages scope.
# Pushing is release.yml's job, which reaches the same shared workflow through
# release.yaml with an `image` set.

on:
  pull_request:
    branches: [main]

jobs:
  build:
    # Explicit even though `read` is all this needs and all the account grants
    # by default. A reusable workflow can only narrow what the caller granted,
    # so the grant belongs here where it is visible. `packages: write` is
    # deliberately absent: nothing is pushed from a pull request.
    permissions:
      contents: read
    # TEMPORARY: points at the branch adding docker-build.yaml so this can be
    # validated before that PR merges. Becomes `@v1` before this merges --
    # @v1 does not carry the file yet.
    uses: jcwearn/workflows/.github/workflows/docker-build.yaml@feat/docker-build-workflow
