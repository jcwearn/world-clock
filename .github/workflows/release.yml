name: Release

# Calls the shared release workflow in jcwearn/workflows, replacing the third
# hand-rolled copy of the same idea.
#
# The copy this replaces created the git tag BEFORE building the image, in a
# single job, with the GitHub Release created last. A failed build would have
# left a pushed tag with neither an image nor a Release behind it. That is not
# hypothetical: ansible-runner ran the same ordering and produced v0.1.29
# through v0.1.35 -- seven tags and Releases with no images, unnoticed for a
# month. Every one of this repo's 20 tags does have an image, so it has been
# lucky rather than correct.
#
# The shared workflow puts publish behind `needs: build`, inside the reusable
# workflow, so a caller cannot rewire it. A failed build now leaves an image
# with no tag, which a retry overwrites from the same source.
#
# move-major-tag is left off (the default). This repo's artifact is the
# container image and Kubernetes pins image tags, so a moving git tag would be
# created and never read. The moving IMAGE tags are unaffected.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    # Both scopes are required, and packages: write is not optional just
    # because the build might be skipped: nested-job permissions are validated
    # statically, before any `if:` runs. Omitting it makes the workflow fail to
    # parse rather than fail at the push.
    permissions:
      contents: write # git tag + GitHub Release
      packages: write # push to GHCR
    uses: jcwearn/workflows/.github/workflows/release.yaml@b5cf63b9fb73b7f54cfbe32778dbc686299d3761 # v1
    with:
      image: ghcr.io/jcwearn/world-clock
      # Docker convention is no prefix, but this repo has always published
      # vX.Y.Z and k3s-cluster pins `:v0.2.12@sha256:...` by string in
      # apps/world-clock/deployment.yaml. Dropping the v would leave Renovate
      # with nothing matching to upgrade -- a silent stall rather than a
      # failure. Drop the shim only if that pin is rewritten at the same time.
      image-tag-prefix: 'v'
