name: Deploy

# Deploys to Cloudflare Pages with this repo's own scoped API token, replacing
# Cloudflare's dashboard Git integration -- which authenticates through a single
# account-level GitHub App shared by every repo and cannot be split per app.
#
# Triggers on push to ANY branch, which is what Cloudflare's Git integration
# did: a branch pushed without a PR still got a preview. --branch decides the
# rest -- equal to the production branch it deploys production, anything else
# becomes a preview at <branch>.world-clock-8mv.pages.dev.
#
# Automatic deployments are now OFF in the dashboard (Build > Branch control),
# which is what stops this from racing Cloudflare's own builder. Both were
# verified by dispatch before that was switched off, in that order: enabling
# push first would have double-deployed every commit, and switching the
# dashboard off first would have left the site with no deploy path.
#
# The Git connection itself is deliberately still attached. It is not what was
# triggering builds, and pages.tf declares the `source` block -- disconnecting
# without changing that would drift, and the next apply would reconnect it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # The Pages PROJECT name, which is not always the repo name -- here they
    # match, but the pages.dev subdomain does NOT: previews land at
    # <branch>.world-clock-8mv.pages.dev, because world-clock.pages.dev was
    # taken when the project was created.
    #
    # Getting project-name wrong does not fail. `wrangler pages deploy` CREATES
    # a project that does not exist, so a typo yields a second empty project
    # while the real site silently stops updating.
    uses: jcwearn/workflows/.github/workflows/cloudflare-pages-deploy.yaml@8c9f2690f495be5546bbef78c555345e464cc593 # v1
    with:
      project-name: world-clock
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
